[package]
name = "tforward"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0"
openssl-probe = "0.1.5"
opentelemetry = "0.31"
opentelemetry-appender-tracing = "0.31"
opentelemetry-otlp = { version = "0.31", features = [
    "grpc-tonic",
    "tls",
    "tls-roots",
] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
serde = "1.0"
serde_json = "1.0"
teloxide = { version = "0.17", default-features = false, features = [
    "ctrlc_handler",
    "rustls",
    "webhooks-axum",
    "macros",
] }
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "sync"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-futures = "0.2.5"
tracing-opentelemetry = "0.32"
tracing-subscriber = "0.3.18"

[lints.clippy]
all = "deny"
correctness = "warn"
complexity = "warn"
pedantic = "warn"
nursery = "warn"
perf = "warn"
cargo = "allow"
